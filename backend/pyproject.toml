[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "twpublisher-backend"
version = "0.1.0"
description = "Backend for deterministic article publishing automation"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "bleach>=6.2,<7",
  "tinycss2>=1.4,<2",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "google-api-python-client>=2.160,<3",
  "google-auth>=2.38,<3",
  "google-auth-httplib2>=0.2,<1",
  "httpx>=0.28,<1",
  "lxml>=5.3,<7",
  "pillow>=11,<13",
  "pydantic-settings>=2.7,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
