name: article-publisher

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-article_publisher}
      POSTGRES_USER: ${POSTGRES_USER:-article_publisher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: development
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-development-only-secret-key-change-me}
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://article_publisher:change-me@db:5432/article_publisher}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
      MAX_DOCX_UNCOMPRESSED_MB: ${MAX_DOCX_UNCOMPRESSED_MB:-200}
      WORDPRESS_MEDIA_MAX_MB: ${WORDPRESS_MEDIA_MAX_MB:-1}
      ARTICLE_STORAGE_PATH: ${ARTICLE_STORAGE_PATH:-/app/.data}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORDPRESS_BASE_URL: ${WORDPRESS_BASE_URL:-}
      WORDPRESS_USERNAME: ${WORDPRESS_USERNAME:-}
      WORDPRESS_APPLICATION_PASSWORD: ${WORDPRESS_APPLICATION_PASSWORD:-}
      RANK_MATH_ENDPOINT: ${RANK_MATH_ENDPOINT:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - ./backend:/app
      - ./secrets:/run/secrets:ro
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
